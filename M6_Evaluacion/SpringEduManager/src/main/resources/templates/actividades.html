<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SpringEduManager - Calificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid px-3 d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold text-info" th:href="@{/cursos}">🎓 SpringEduManager</a>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <a class="btn btn-sm btn-outline-light" th:href="@{/cursos}">Cursos</a>
            <a class="btn btn-sm btn-success fw-bold" th:href="@{/actividades}">Actividades/Notas</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
        </div>
        <div class="d-flex align-items-center mt-2 mt-md-0">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-danger fw-bold">Salir 🚪</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid px-3 px-md-5">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h1 class="display-6 fw-bold text-success">Control de Prácticas y Evaluaciones</h1>
            <p class="lead text-muted small">Vista actual: <span class="fw-bold text-dark" th:text="${modoVista}">Modo de Vista</span></p>
            <hr>
        </div>
    </div>

    <!-- FORMULARIO OPERATIVO (ADMIN) -->
    <div class="row mb-4" sec:authorize="hasRole('ADMIN')">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="mb-0 fw-bold" th:text="${actividadEdit.id != null} ? '✏️ Actualizar Calificación Académica' : '➕ Ingresar Nueva Calificación'">Ingresar Nueva Calificación</h5>
                </div>
                <div class="card-body p-3">
                    <form th:action="@{/actividades/guardar}" th:object="${actividadEdit}" method="post" class="row g-3">
                        <input type="hidden" th:field="*{id}">
                        <div class="col-12 col-sm-6 col-md-3">
                            <label class="form-label fw-bold small">Estudiante / Alumno</label>
                            <select th:field="*{usuario.id}" class="form-select" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option th:each="u : ${todosLosUsuarios}" th:value="${u.id}" th:text="${u.nombre}">Juan</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-6 col-md-3">
                            <label class="form-label fw-bold small">Curso / Módulo</label>
                            <select th:field="*{curso.id}" class="form-select" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option th:each="c : ${todosLosCursos}" th:value="${c.id}" th:text="${c.nombre}">Spring</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-8 col-md-3">
                            <label class="form-label fw-bold small">Nombre de la Práctica</label>
                            <input type="text" th:field="*{practica}" class="form-control" required>
                        </div>
                        <div class="col-12 col-sm-4 col-md-1.5">
                            <!-- CORRECCIÓN: Quitamos el 'required' para permitir dejar la nota en blanco/Pendiente -->
                            <label class="form-label fw-bold small">Nota (Vacío = Pendiente)</label>
                            <input type="number" th:field="*{evaluacion}" class="form-control" step="0.1" min="1.0" max="7.0" placeholder="Pendiente">
                        </div>
                        <div class="col-12 col-md-1.5 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2" th:text="${actividadEdit.id != null} ? 'Actualizar' : 'Guardar'">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- TABLA DE CALIFICACIONES -->
    <div class="row mb-5">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-secondary text-white py-3">
                    <h5 class="mb-0 fw-bold">Registro de Notas del Bootcamp</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th class="text-center" style="width: 10%">ID</th>
                                <th style="width: 20%">Estudiante</th>
                                <th style="width: 25%">Curso / Módulo</th>
                                <th style="width: 25%">Práctica / Tarea</th>
                                <th class="text-center" style="width: 10%">Nota</th>
                                <th class="text-center" style="width: 10%" sec:authorize="hasRole('ADMIN')">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="act : ${listaActividades}">
                                <td class="text-center fw-bold text-secondary" th:text="${act.id}">1</td>
                                <td th:text="${act.usuario.nombre}">Nombre</td>
                                <td th:text="${act.curso.nombre}">Curso</td>
                                <td th:text="${act.practica}">Práctica</td>
                                <!-- CORRECCIÓN: Si la nota es nula, pinta la palabra "Pendiente" en gris -->
                                <td class="text-center fw-bold fs-6">
                                    <span th:if="${act.evaluacion != null}" th:text="${act.evaluacion}" th:classappend="${act.evaluacion < 4.0} ? 'text-danger' : 'text-primary'">7.0</span>
                                    <span th:if="${act.evaluacion == null}" class="text-muted fst-italic small">Pendiente ⏳</span>
                                </td>
                                <td class="text-center" sec:authorize="hasRole('ADMIN')">
                                    <div class="d-flex justify-content-center gap-1">
                                        <a th:href="@{/actividades/editar/{id}(id=${act.id})}" class="btn btn-xs btn-warning fw-bold text-dark btn-sm">Editar</a>
                                        <a th:href="@{/actividades/eliminar/{id}(id=${act.id})}"
                                           class="btn btn-xs btn-danger fw-bold btn-sm"
                                           onclick="return confirm('⚠️ ¿Estás seguro de eliminar esta calificación?');">Eliminar</a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://jsdelivr.net" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
crossorigin="anonymous"></script>
</body>
</html>
