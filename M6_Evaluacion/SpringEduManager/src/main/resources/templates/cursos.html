<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SpringEduManager - Cursos</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5">
    <!-- Encabezado de la Plataforma -->
    <div class="row mb-4">
        <div class="col text-center">
            <h1 class="display-5 fw-bold text-primary">Plataforma Académica SpringEduManager</h1>
            <p class="lead text-muted">Módulo de Coordinación Académica — Gestión de Cursos</p>
            <hr class="my-4">
        </div>
    </div>
    <!-- Formulario Operativo para agregar nuevos cursos -->
    <div class="row mb-5">
        <div class="col-md-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold">Registrar Nuevo Curso</h5>
                </div>
                <div class="card-body p-4">
                <!-- th:action apunta a la ruta POST de tu CursoWebController -->
                <form th:action="@{/cursos/guardar}" method="post" class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label fw-bold">Nombre del Curso</label>
                        <input type="text" name="nombre" class="form-control form-control-lg" placeholder="Ej: Introducción a Spring Boot 3" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold">Descripción Académica</label>
                        <input type="text" name="descripcion" class="form-control form-control-lg" placeholder="Ej: Fundamentos de inyección de dependencias..." required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Tabla Dinámica para listar los cursos existentes -->
<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white py-3">
                <h5 class="mb-0 fw-bold">Listado de Cursos Disponibles</h5>
            </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr class="text-center">
                                    <th style="width: 10%">ID</th>
                                    <th style="width: 30%">Nombre del Curso</th>
                                    <th style="width: 60%">Descripción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- th:each recorre la variable 'listaCursos' inyectada desde el WebController -->
                                <tr th:each="curso : ${listaCursos}">
                                    <td class="text-center fw-bold text-secondary" th:text="${curso.id}">1</td>
                                    <td class="fw-semibold text-dark" th:text="${curso.nombre}">Nombre de Ejemplo</td>
                                    <td class="text-muted" th:text="${curso.descripcion}">Descripción de Ejemplo</td>
                                    </tr>
                                    <!-- Mensaje en caso de que la lista esté vacía -->
                                    <tr th:if="${#lists.isEmpty(listaCursos)}">
                                    <td colspan="3" class="text-center text-muted py-4">No hay cursos registrados en el sistema.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Script de Bootstrap -->
<script src="https://jsdelivr.net"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
