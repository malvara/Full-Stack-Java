<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SpringEduManager - Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<!-- BARRA DE NAVEGACIÓN GLOBAL -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid px-3 d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold text-info" th:href="@{/cursos}">🎓 SpringEduManager</a>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <a class="btn btn-sm btn-outline-light" th:href="@{/cursos}">Cursos</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/actividades}">Actividades/Notas</a>
            <a class="btn btn-sm btn-info fw-bold text-dark" th:href="@{/usuarios}">Usuarios</a>
        </div>
        <div class="d-flex align-items-center mt-2 mt-md-0">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-danger fw-bold">Salir 🚪</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid px-3 px-md-5">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h1 class="display-6 fw-bold text-info">Gestión de Usuarios y Accesos</h1>
            <p class="lead text-muted small">Matrícula Operativa de Alumnos y Administradores</p>
            <hr>
        </div>
    </div>

    <!-- FORMULARIO: REGISTRAR USUARIO (ADMIN) -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white py-3">
                    <h5 class="mb-0 fw-bold" th:text="${usuarioEdit.id != null} ? '✏️ Actualizar Alumno / Administrador' : '➕ Matricular Nuevo Alumno'">Matricular Nuevo Alumno</h5>
                </div>
                <div class="card-body p-3">
                    <form th:action="@{/usuarios/guardar}" th:object="${usuarioEdit}" method="post" class="row g-3">
                        <input type="hidden" th:field="*{id}">
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="form-label fw-bold small">Nombre Completo</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="form-label fw-bold small">Correo (Username)</label>
                            <input type="email" th:field="*{username}" class="form-control" required>
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="form-label fw-bold small">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control" th:required="${usuarioEdit.id == null}">
                        </div>
                        <div class="col-12 col-sm-3 col-md-3">
                            <label class="form-label fw-bold small">Rol de Acceso</label>
                            <select th:field="*{rol}" class="form-select" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="USER">USER (Estudiante)</option>
                                <option value="ADMIN">ADMIN (Coordinador)</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-3 col-md-3">
                            <label class="form-label fw-bold small">Edad</label>
                            <input type="number" th:field="*{edad}" class="form-control" min="15" max="99" required>
                        </div>
                        <div class="col-12 col-md-6 d-flex align-items-end">
                            <button type="submit" class="btn btn-info text-white fw-bold w-100 py-2" th:text="${usuarioEdit.id != null} ? 'Actualizar Credenciales' : 'Registrar y Otorgar Credenciales'">Registrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- TABLA DE USUARIOS (Responsiva) -->
    <div class="row mb-5">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-secondary text-white py-3">
                    <h5 class="mb-0 fw-bold">Padrón Oficial de Usuarios Enrolados</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th class="text-center" style="width: 10%">ID</th>
                                <th style="width: 25%">Nombre</th>
                                <th style="width: 30%">Email / Cuenta</th>
                                <th class="text-center" style="width: 15%">Rol Asignado</th>
                                <th class="text-center" style="width: 10%">Edad</th>
                                <th class="text-center" style="width: 10%">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${listaUsuarios}">
                                <td class="text-center fw-bold text-secondary" th:text="${user.id}">1</td>
                                <td class="fw-semibold text-dark" th:text="${user.nombre}">Nombre</td>
                                <td class="text-muted small" th:text="${user.username}">Email</td>
                                <td class="text-center">
                                    <span class="badge" th:text="${user.rol}" th:classappend="${user.rol == 'ADMIN'} ? 'bg-danger' : 'bg-primary'">USER</span>
                                </td>
                                <td class="text-center text-dark" th:text="${user.edad}">25</td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-1">
                                        <a th:href="@{/usuarios/editar/{id}(id=${user.id})}" class="btn btn-xs btn-warning fw-bold text-dark btn-sm">Editar</a>
                                        <!-- INTERRUPTOR DE SEGURIDAD ONCLICK: Pide confirmación al Admin antes de ir al controlador -->
                                        <a th:href="@{/usuarios/eliminar/{id}(id=${user.id})}"
                                           class="btn btn-xs btn-danger fw-bold btn-sm"
                                           onclick="return confirm('⚠️ ¿Estás absolutamente seguro de que deseas desmatricular y eliminar permanentemente a este usuario del sistema criptográfico?');">Eliminar</a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://jsdelivr.net" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
