<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Full Stack Java Trainee - Evaluación Módulo 2">
    <meta name="keywords" content="HTML,CSS,Javascript,Bootsrap,JQuery">
    <meta name="author" content="Nelson Alvarado Ojeda">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluacion Modulo 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="x01.css">
</head>

<body>
    <!-- Barra de navegación -->
    <nav class="topnav" id="nav">
        <a class="n1" href="menu.html">Inicio</a>
        <a class="n1" href="deposit.html">Administración</a>
        <a class="n1" href="sendmoney.html">Transferencias</a>
        <a class="n1" href="transaction.html">Movimientos</a>
        <div class="topnav-right">
            <a class="n1" href="close.html">Salir</a>
        </div>
    </nav>
    <!-- Principal -->
    <div class="card card-saldo shadow border-0 mb-4">
        <div class="card-body text-center p-4">
            <h5 class="card-title text-uppercase opacity-75"><strong>Saldo Disponible</strong> </h5><hr>
            <h1 class="display-4 fw-bold" id="txt-saldo">$0</h1>
        </div>
    </div>
    <div class="row">
        <!-- Gestión de contactos -->
        <div class="col-md-6">
            <div class="card shadow border-0 h-100">
                <div class="card-body p-4">
                    <h5 class="text-center" class="card-title text-uppercase opacity-75"><strong>CONTACTOS</strong> </h5><hr>
                    <ul class="list-group list-group-flush" id="lista-visual-contactos">
                        <!-- jQuery inyectará los contactos aquí -->
                    </ul>
                </div>
            </div>
        </div>
        <!-- Transferencias -->
        <div class="col-md-6">
            <div class="card shadow border-0 h-100">
                <div class="card-body p-4">
                    <h5 class="text-center" class="card-title text-uppercase opacity-75"><strong>TRANSFERENCIA</strong> </h5><hr>
                    <!-- Selector de Destinatario -->
                    <div class="mb-3">
                        <label for="select-contacto" class="form-label text-muted fw-bold">Destinatario</label>
                        <select class="form-select" id="select-contacto">
                            <option value="" selected disabled>Elige un contacto...</option>
                            <!-- Se rellena automáticamente con jQuery -->
                        </select>
                    </div>
                    <!-- Campo de Monto -->
                    <div class="mb-3">
                        <label for="input-monto" class="form-label text-muted fw-bold">Monto a Enviar ($)</label>
                        <input type="number" class="form-control" id="input-monto" min="1" placeholder="Ej: 5000">
                    </div>

                    <button class="btn btn-primary w-100 fw-bold py-2" id="btn-transferir">Transferir</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Pie de página -->
    <footer class="f01">
        <adress>
            <i class="fas fa-envelope"></i>&nbsp ankewallet@nao.cl<br>
            &copy; Copyright 2026 All Rights Reserved, NAO
        </adress>
    </footer>
    <!-- CDN de JQuery, Bootstrap y archivo js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="x01.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
